# GitHub Actions: 自动打包分发
#
# 触发条件：推送 v* tag（如 v0.4.0）
# 构建 macOS（Apple Silicon）、Windows 和 Linux 产物并发布到 GitHub Releases
#
# 当前 macOS 产物不签名、不公证（打包时设置 CSC_IDENTITY_AUTO_DISCOVERY=false）：
# 首次打开需右键「打开」绕过 Gatekeeper，且 macOS 自动更新（Squirrel.Mac）不可用。
# 如需签名，请配置 MAC_CERTS / MAC_CERTS_PASSWORD / APPLE_ID 等 secrets 并恢复证书导入步骤。
# GITHUB_TOKEN 由 GitHub Actions 自动提供，无需手动配置。

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac-arm64:
    name: build (macos-latest, mac, arm64, --arm64)
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（macOS arm64）
        run: bun run --filter='@proma/electron' prepare:officecli

      # 构建应用
      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      # 打包并发布到 GitHub Releases（未签名，跳过签名自动发现）
      - name: 打包并发布 (macOS arm64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          for i in 1 2 3; do
            if npx electron-builder --mac --arm64 --publish always; then
              exit 0
            fi

            if [ "$i" -lt 3 ]; then
              echo "Attempt $i failed, retrying in 10s..."
              sleep 10
            fi
          done

          echo "macOS ARM64 packaging failed after 3 attempts"
          exit 1
        working-directory: apps/electron

  build-linux-x64:
    name: build (ubuntu-22.04, linux, x64)
    runs-on: ubuntu-22.04

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: 安装依赖
        run: bun install --frozen-lockfile

      - name: 准备 OfficeCLI（Linux x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: 打包并发布 (Linux x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish always
        working-directory: apps/electron

  build-windows-x64:
    name: build (windows-latest, win, x64, --x64)
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        run: bun install --frozen-lockfile

      # 准备当前 runner 架构的 OfficeCLI 资源
      - name: 准备 OfficeCLI（Windows x64）
        run: bun run --filter='@proma/electron' prepare:officecli

      - name: 构建 Electron 应用
        run: bun run electron:build
        working-directory: .

      - name: 准备运行时依赖
        shell: bash
        run: |
          bun run --filter='@proma/electron' sync:runtime-deps
          bun run --filter='@proma/electron' rebuild:node-pty

      - name: 打包并发布 (Windows)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always
        working-directory: apps/electron
